name: GeoAlarm
options:
  bundleIdPrefix: com.elias
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  SWIFT_VERSION: "5.0"
  DEVELOPMENT_TEAM: "Q2U8K9N3BL"
targets:
  GeoAlarm:
    type: application
    platform: iOS
    sources:
      - path: GeoAlarm
        excludes:
          - "Sounds/**"
      - path: GeoAlarm/Sounds
        type: folder
        buildPhase: resources
    settings:
      INFOPLIST_FILE: GeoAlarm/Info.plist
      CODE_SIGN_ENTITLEMENTS: GeoAlarm/GeoAlarm.entitlements
      PRODUCT_BUNDLE_IDENTIFIER: com.elias.geoalarm
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: 1
      TARGETED_DEVICE_FAMILY: "1"
      SWIFT_STRICT_CONCURRENCY: minimal
